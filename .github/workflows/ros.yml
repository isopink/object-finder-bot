name: ros

on:
  push:
  pull_request:

jobs:
  ros:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        distro: [foxy, humble]
    container:
      image: ros:${{ matrix.distro }}
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      ROS_DOMAIN_ID: 42
    steps:
      - uses: actions/checkout@v4

      - name: Refresh the ROS apt key
        # Old ros images carry an expired key; replace it with the current one.
        run: |
          # Drop every ROS source (.list or deb822 .sources) so no Signed-By values conflict.
          rm -f /etc/apt/sources.list.d/ros* /usr/share/keyrings/ros*
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key             | gpg --dearmor -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main"             > /etc/apt/sources.list.d/ros2.list
          apt-get update

      - name: Install
        run: |
          apt-get install -y --no-install-recommends \
            ros-${{ matrix.distro }}-nav2-msgs ros-${{ matrix.distro }}-tf2-ros \
            ros-${{ matrix.distro }}-visualization-msgs ros-${{ matrix.distro }}-launch-ros \
            python3-pip python3-numpy python3-yaml python3-pil python3-pytest python3-colcon-common-extensions
          # numpy and pyyaml come from apt, as on the Jetson. The distro pip on
          # Jammy builds pyproject-only packages as "UNKNOWN"; a newer pip does not.
          python3 -m pip install -U "pip<25"
          python3 -m pip install --no-deps .
          python3 -c "import objmem, objmem.types; print('objmem', objmem.__file__)"

      - name: colcon build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          cd ros
          colcon build --packages-select objmem_ros --event-handlers console_direct+

      - name: Unit tests (no ROS)
        run: python3 -m pytest -q ros/objmem_ros/test

      - name: Finder end to end (fake worker, fake Nav2)
        timeout-minutes: 5
        run: |
          source ros/install/setup.bash
          python3 ros/objmem_ros/test/ros_e2e.py

      - name: Launch file smoke test
        timeout-minutes: 5
        run: |
          source ros/install/setup.bash
          python3 ros/objmem_ros/test/ros_launch_smoke.py "$GITHUB_WORKSPACE/config/default.yaml"
