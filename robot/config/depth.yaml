# objmem tunable values. Keys are flat and match objmem.types.Params.
# In the classroom, edit this file only; do not edit code.

# Existence confidence (proposal 4.3)
d: 0.8              # P(detect | present)
f: 0.1              # P(detect | absent)
tau: 600.0          # time-decay constant (s)
p_init: 0.7         # confidence of a new memory

# Same-object test (proposal 4.2)
maha_thresh: 4.0    # Mahalanobis distance gate (3.0 split one cup into 3 memories 10-20 cm apart, 2026-11-28)
cos_thresh: 0.75    # CLIP image-image cosine gate (0.8; the cup seen from other sides fell below it)

# Search (proposal 4.4)
T: 0.05             # softmax temperature
top_k: 3
found_thresh: 0.5   # re-check probability that counts as found
standoff: 0.6       # stop this far from the object (m)
pos_cov_max: 0.25   # above this position variance (m^2), drive to where the object was seen from

# Camera: "depth" (RealSense) or "nodepth" (C920)
camera_mode: depth
img_w: 640
img_h: 480
fx: 386.98          # measured on the D455f 2026-11-27 (vision/print_intrinsics.py, 640x480 color)
fy: 386.56
cx: 321.45
cy: 244.14
hfov: 1.3819          # rad (79.2 deg); 2 atan(img_w / 2 fx)
depth_min: 0.3      # usable range (m)
depth_max: 4.0

# Camera mount in base_link: RealSense D455 on the mast, 2026-11-27 (same spot as the C920 had;
# level, looking along +x = the direction `w` drives)
cam_x: 0.055
cam_y: 0.05
cam_z: 0.815
cam_yaw: 0.0
cam_pitch: 0.0      # rad, positive = tilted down

# Observation noise
sigma_range_a: 0.05  # 0.02 + pose error of AMCL and of the camera mount, measured 2026-11-28
sigma_range_b: 0.01
sigma_bearing: 0.06  # 0.03 rad; AMCL heading error is 1-2 deg on its own
nominal_range: 2.0
sigma_range_nodepth: 1.5

# Vision
crop_pad: 0.1
clip_logit_scale: 100.0
background_prompts:
  - a photo of a wall
  - a photo of the floor
  - a photo of a ceiling
  - a photo of a desk
  - a photo of a chair
  - a photo of a person
  - a photo of a computer monitor
  - a photo of a keyboard
  - a blurry photo of a room

# Processes
worker_url: http://127.0.0.1:8600
mapview_port: 8555
search_log: ""      # JSON-lines search log for scripts/evaluate.py; "" = none (the launch file can set it)

# Speech queries (ros2 run objmem_ros ask --voice)
whisper_model: base.en
mic_device: ""      # e.g. plughw:2,0 (see arecord -l); "" = ALSA default
