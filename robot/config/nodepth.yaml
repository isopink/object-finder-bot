# objmem tunable values. Keys are flat and match objmem.types.Params.
# In the classroom, edit this file only; do not edit code.

# Existence confidence (proposal 4.3)
d: 0.8              # P(detect | present)
d_by_range: []      # rows [up to this distance (m), P(detect | present)], measured by scripts/fit_detection_range.py; [] = d everywhere
f: 0.1              # P(detect | absent)
tau: 600.0          # time-decay constant (s)
p_init: 0.7         # confidence of a new memory
p_update_dist: 0.0  # robot travel between two Bayes updates of one memory's p (m); 0 = every frame

# Same-object test (proposal 4.2)
maha_thresh: 3.0    # Mahalanobis distance gate
cos_thresh: 0.8     # CLIP image-image cosine gate
cos_thresh_same_label: 0.0  # cosine gate when observation and memory have the same label; 0 = use cos_thresh
merge_dist: 0.0     # merge two memories of the same object closer than this (m); 0 = never merge
pos_std_min: 0.0    # smallest position std kept after fusion (m); 0 = no floor

# Search (proposal 4.4)
T: 0.05             # softmax temperature
top_k: 3
found_thresh: 0.5   # re-check probability that counts as found
standoff: 0.6       # stop this far from the object (m)
pos_cov_max: 0.25   # above this position variance (m^2), drive to where the object was seen from

# Camera: "depth" (RealSense) or "nodepth" (C920)
camera_mode: nodepth
img_w: 640
img_h: 480
fx: 457.01
fy: 457.01
cx: 320.0
cy: 240.0
hfov: 1.2217          # horizontal field of view (rad); 2 atan(img_w / 2 fx); print_intrinsics.py prints it
depth_min: 0.3      # usable range (m)
depth_max: 4.0

# Camera mount in base_link (measure after mounting the mast)
cam_x: 0.205
cam_y: 0.05
cam_z: 0.825
cam_yaw: 0.0
cam_pitch: 0.0698      # rad, positive = tilted down

# Observation noise
sigma_range_a: 0.02
sigma_range_b: 0.01
sigma_bearing: 0.03
nominal_range: 2.0
sigma_range_nodepth: 1.5

# Vision
crop_pad: 0.1
clip_logit_scale: 100.0
background_prompts:
  - a photo of a wall
  - a photo of the floor
  - a photo of a ceiling
  - a photo of a desk
  - a photo of a chair
  - a photo of a person
  - a photo of a computer monitor
  - a photo of a keyboard
  - a blurry photo of a room

# Processes
worker_url: http://127.0.0.1:8600
mapview_port: 8555
search_log: ""      # JSON-lines search log for scripts/evaluate.py; "" = none (the launch file can set it)
evidence_log: ""    # JSON-lines log of every look at a remembered place; robot/objmem.sh sets it to <log dir>/evidence.jsonl

# Speech queries (ros2 run objmem_ros ask --voice)
whisper_model: base.en
mic_device: ""      # e.g. plughw:2,0 (see arecord -l); "" = ALSA default
